# mgu-render-id7-touch: idrive7-renderd started by renderd-touch.sh, which runs its unit's own command with touch_area
# added; without that script (the tool's folder gone), idrive7-renderd 2.1.19's command, so the renderer still starts
[Service]
ExecStart=
ExecStart=/bin/sh -c 'w=/var/opt/mgu-render-id7-touch/current/renderd-touch.sh; [ -r $$w ] && exec /bin/sh $$w; exec /var/opt/idrive7-renderd/current/mgu-renderd -s socket_path=/run/mgu-renderd/renderd.sock -s socket_group=tm_oap_app -s embed_marker=/run/mgu-renderd-hmi/hmi-template'
SyslogIdentifier=mgu-renderd
